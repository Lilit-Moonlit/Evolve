version: "3.8"

services:
  nostr-relay:
    image: scsibug/nostr-rs-relay:latest
    container_name: evolve-city-relay
    restart: unless-stopped
    ports:
      - "7000:7000"
    volumes:
      - ./data:/app/db
      - ./config.toml:/app/config.toml:ro
    environment:
      - RUST_LOG=info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
