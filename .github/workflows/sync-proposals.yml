# Serverless proposals sync — NO central server.
# Runs scripts/sync-proposals.mjs (GitHub + Codeberg + GitLab issues), commits
# the refreshed manifest (apps/web/public/proposals.json) via the github-actions
# bot, and pins it to IPFS (Pinata CAR upload) when credentials exist.
# NEVER switch the pin step to web3.storage/Storacha — service shut down.
name: Sync Proposals

on:
  workflow_dispatch:
  schedule:
    # Daily at 03:07 UTC (off the top of the hour to avoid cron congestion)
    - cron: "7 3 * * *"

permissions:
  contents: write

concurrency:
  group: sync-proposals
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync proposals manifest
        run: npm run sync-proposals
        env:
          GITHUB_REPO: ${{ vars.GITHUB_REPO }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CODEBERG_REPO: ${{ vars.CODEBERG_REPO }}
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
          GITLAB_PROJECT: ${{ vars.GITLAB_PROJECT }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}

      - name: Commit manifest if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/public/proposals.json
          if git diff --cached --quiet; then
            echo "proposals.json unchanged — nothing to commit"
          else
            git commit -m "chore(sync): refresh proposals manifest from forges"
            git push
          fi

      # Gate via step output: bash env check is deterministic on every runner
      # version, so the pin steps below never run without credentials.
      - name: Detect pinning credentials
        id: pin_gate
        env:
          PINATA_JWT: ${{ secrets.PINATA_JWT }}
        run: |
          if [ -n "$PINATA_JWT" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      # Merkleize the manifest into a CAR (deterministic CID), then upload the
      # CAR bytes to Pinata's v3 Files API (server-side CAR unpack + pin).
      - name: Create IPFS CAR
        id: deploy
        if: steps.pin_gate.outputs.enabled == 'true'
        uses: ipshipyard/ipfs-deploy-action@v2
        with:
          path-to-deploy: apps/web/public/proposals.json
          cid-profile: unixfs-v1-2025
          github-token: ${{ github.token }}

      - name: Upload CAR to Pinata
        if: steps.pin_gate.outputs.enabled == 'true'
        env:
          PINATA_JWT: ${{ secrets.PINATA_JWT }}
          CID: ${{ steps.deploy.outputs.cid }}
          CAR_PATH: ${{ steps.deploy.outputs.car-path }}
        run: |
          PIN_NAME="${GITHUB_REPOSITORY//\//-}-proposals-${GITHUB_SHA:0:7}"
          response=$(curl -sS -w "\n%{http_code}" -X POST \
            "https://uploads.pinata.cloud/v3/files" \
            -H "Authorization: Bearer ${PINATA_JWT}" \
            -F "network=public" \
            -F "file=@${CAR_PATH}" \
            -F "name=${PIN_NAME}" \
            -F "car=true")
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          if [ "$http_code" != "200" ]; then
            echo "::error::Pinata upload failed (HTTP $http_code): $body"
            exit 1
          fi
          echo "Pinned proposals manifest to Pinata as ${PIN_NAME} (CID ${CID})"

      - name: Skip IPFS pinning
        if: steps.pin_gate.outputs.enabled != 'true'
        run: 'echo "skip: no pinning credentials"'
