# Render Blueprint — personal preview of the full Evolve web app.
# Free web service: sleeps after 15 min idle, wakes in ~1 min, HTTPS + WebSockets.
# Connect the GitHub repo and apply this Blueprint; pushes to `main` auto-deploy.
# Codeberg/GitLab mirrors do not trigger Render unless the same commit is on GitHub.
services:
  - type: web
    name: evolve-web
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Vite inlines this at image build time (see Dockerfile). Kept here so
      # the dashboard shows the intended mode. Rebuild after changing it.
      - key: VITE_PRODUCT_MODE
        value: full
      # P2P 1:1 chat bootstrap relay multiaddr (a volunteer/self-hosted
      # gossipsub relay). Empty until a public relay is provisioned — the app
      # then falls back to the HTTP chat mirror (Ban Resistance §23 rule 2).
      # No hardcoded domain: keep it env-driven.
      - key: VITE_P2P_BOOTSTRAP_PEERS
        sync: false
      # Local chat city Nostr relay. Empty until a public city relay is
      # provisioned (per-city volunteer relay — DECENTRALIZED-SCALING §6.2).
      # The client requires a NIP-07 signer (window.nostr) to publish; without
      # one it falls back to HTTP. No hardcoded domain.
      - key: VITE_NOSTR_CITY_RELAY_URL
        sync: false
      # Optional. Leave empty for the ephemeral JSON store. Set a Postgres URL
      # (Neon/Supabase/Render) later if profiles should survive sleep/redeploy.
      - key: DATABASE_URL
        sync: false
